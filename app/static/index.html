<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperLens</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div><strong>PaperLens</strong><span>对话式多智能体论文阅读</span></div>
    <div class="upload-row">
      <input id="file" type="file" accept="application/pdf">
      <button id="upload">上传 / 打开论文</button>
      <button id="reanalyze" class="secondary hidden">重新分析</button>
    </div>
  </header>
  <p id="status" class="status global-status">请上传 PDF；重复上传会复用已完成的分析。</p>
  <main id="workspace" class="workspace hidden">
    <aside class="conversation-column panel">
      <div class="panel-header"><h2>历史对话</h2><button id="newConversation">＋ 新建</button></div>
      <input id="conversationSearch" type="search" placeholder="搜索对话">
      <div id="conversationList" class="conversation-list"></div>
    </aside>
    <section class="reading-column panel">
      <div class="panel-header"><h2>阅读卡片</h2><button id="openPdf" class="secondary">查看原文</button></div>
      <div id="summary"></div>
      <details id="figurePanel" class="hidden"><summary>Figure / Table 概览</summary><div id="figures" class="figures"></div></details>
    </section>
    <section class="chat-column panel">
      <div class="chat-header">
        <div><h2 id="conversationTitle">当前聊天</h2><small id="contextState">请选择或新建对话 · 当前论文内隔离上下文</small></div>
        <div><button id="renameConversation" class="secondary" disabled>重命名</button><button id="archiveConversation" class="danger" disabled>归档</button></div>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="question" rows="3" maxlength="1000" placeholder="基于当前论文提问；Enter 发送，Shift+Enter 换行" disabled></textarea>
        <div><span id="runState"></span><button id="cancelRun" type="button" class="danger hidden">停止</button><button id="send" type="submit" disabled>发送</button></div>
      </form>
    </section>
  </main>
  <div id="evidenceDrawer" class="drawer hidden" role="dialog" aria-modal="true">
    <div class="drawer-shell">
      <div class="panel-header"><h2>论文证据</h2><button id="closeDrawer" class="secondary">关闭</button></div>
      <div id="evidenceDetail"></div>
      <div class="pdf-toolbar"><button id="previousPage">上一页</button><span id="pageInfo">未加载</span><button id="nextPage">下一页</button></div>
      <div id="pdfStage" class="pdf-stage"><div id="pdfPage"><canvas id="pdfCanvas"></canvas><div id="textLayer"></div><div id="highlight"></div></div></div>
    </div>
  </div>
</body>
</html>
